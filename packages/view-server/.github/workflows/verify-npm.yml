name: Verify generic delivery packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Build exact dependency artifacts and verify isolated consumers
        run: |
          : > "$RUNNER_TEMP/user.npmrc"
          : > "$RUNNER_TEMP/global.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/user.npmrc"
          export NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/global.npmrc"
          export NPM_CONFIG_REGISTRY=https://registry.npmjs.org
          git init --quiet "$RUNNER_TEMP/projection"
          git -C "$RUNNER_TEMP/projection" remote add origin https://github.com/zixcel/projection-runtime.git
          git -C "$RUNNER_TEMP/projection" fetch --quiet --depth=1 origin c8a5e4bebc56a8d726772664c92870228378de6b
          git -C "$RUNNER_TEMP/projection" checkout --quiet --detach FETCH_HEAD
          mkdir "$RUNNER_TEMP/consumer"
          mkdir "$RUNNER_TEMP/consumer/archives"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/consumer/archives"
          npm pack ./packages/delivery-contracts --ignore-scripts --json --pack-destination "$RUNNER_TEMP/consumer/archives"
          for folder in . packages/projection-contracts packages/projection-client packages/dom-renderer; do
            (cd "$RUNNER_TEMP/projection/$folder" && npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/consumer/archives")
          done
          cd "$RUNNER_TEMP/consumer"
          printf '%s\n' '{"private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund ./archives/*.tgz typescript@5.9.3 @types/node@24.12.0
          cp "$GITHUB_WORKSPACE/packages/delivery-contracts/test/consumer.mts" .
          node node_modules/typescript/bin/tsc --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 consumer.mts
          ln -s "$RUNNER_TEMP/consumer/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          node --test test/*.test.mjs packages/delivery-contracts/test/*.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-generic-delivery-packages
          path: ${{ runner.temp }}/consumer/archives/zixcel-view-delivery*.tgz
          if-no-files-found: error
          retention-days: 7
