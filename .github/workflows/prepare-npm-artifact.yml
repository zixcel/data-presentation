name: Prepare reviewed npm artifacts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify current owner provenance without restoring retired repositories
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess
          from pathlib import Path, PurePosixPath
          record = Path('source-consolidation.json')
          assert record.is_file() and not record.is_symlink() and record.stat().st_size <= 65536
          data = json.loads(record.read_text())
          assert data['owner_repository'] == os.environ['GITHUB_REPOSITORY']
          for component in data.get('components', []):
              assert component['owner_repository'] == data['owner_repository']
              assert re.fullmatch(r'[0-9a-f]{40}', component['source_head'])
              path = PurePosixPath(component['subpath'])
              assert not path.is_absolute() and '..' not in path.parts
              assert (Path('.') / path).is_dir()
              assert not {'history_archive', 'history_ref', 'local_history_ref'} & component.keys()
          if not data.get('components'):
              assert re.fullmatch(r'[0-9a-f]{40}', data['source_sha'])
          assert 'canonical_history_bundle' not in data
          paths = subprocess.check_output(['git', 'ls-files', '-z'], timeout=10).decode().split('\0')
          assert len(paths) <= 8192
          assert not any(p.endswith('.bundle') or 'source-history' in PurePosixPath(p).parts for p in paths if p)
          print('Current owner provenance verified; no historical repository restoration')
          PYCODE
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Isolate public registry configuration
        run: |
          : > "$RUNNER_TEMP/user.npmrc"
          : > "$RUNNER_TEMP/global.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/user.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_REGISTRY=https://registry.npmjs.org" >> "$GITHUB_ENV"
      - run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.29.3
      - name: Validate workspace and dependency graph
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run check:typescript
          git diff --exit-code -- src packages/view-contracts/src packages/projection-client/src packages/projection-contracts/src packages/dom-renderer/src packages/view-server/src
          pnpm -r --include-workspace-root typecheck
          pnpm -r --include-workspace-root test
          pnpm audit --audit-level=low
      - name: Pack exact source distributions without lifecycle hooks
        run: |
          mkdir outgoing
          npm pack --ignore-scripts --json --pack-destination "$GITHUB_WORKSPACE/outgoing"
          (cd packages/projection-contracts && npm pack --ignore-scripts --json --pack-destination "$GITHUB_WORKSPACE/outgoing")
          (cd packages/projection-client && npm pack --ignore-scripts --json --pack-destination "$GITHUB_WORKSPACE/outgoing")
          (cd packages/dom-renderer && npm pack --ignore-scripts --json --pack-destination "$GITHUB_WORKSPACE/outgoing")
          (cd packages/view-server && npm pack --ignore-scripts --json --pack-destination "$GITHUB_WORKSPACE/outgoing")
          (cd packages/view-contracts && npm pack --ignore-scripts --json --pack-destination "$GITHUB_WORKSPACE/outgoing")
          printf '%s\n' "$GITHUB_SHA" > outgoing/source-sha.txt
          (cd outgoing && sha256sum ./*.tgz > SHA256SUMS)
      - name: Verify the archive consumer and runnable playground
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/verify-packed-consumer.mts --browser
          pnpm playground:build
          pnpm playground:test
          pnpm --dir packages/dom-renderer test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-npm-packages
          path: outgoing/
          if-no-files-found: error
          retention-days: 3
